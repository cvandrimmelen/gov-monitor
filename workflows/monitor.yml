name: Agenda Monitor

on:

  schedule:
    - cron: '0 13 * * *'

  workflow_dispatch:

jobs:

  monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python monitor.py

      - name: Commit Updates

        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || git commit -m "Update agenda history"

          git push
